<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Web Avanzada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Custom scrollbar for history drawer */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 4px;
        }
        .btn-press:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-2 sm:p-4 transition-colors duration-300">

    <div class="w-full max-w-4xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Calculator Main Area -->
        <div class="flex-1 p-5 sm:p-8 flex flex-col justify-between">
            
            <!-- Top Controls (Theme & History Toggle) -->
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center space-x-2">
                    <div class="w-3 h-3 bg-rose-500 rounded-full"></div>
                    <div class="w-3 h-3 bg-amber-500 rounded-full"></div>
                    <div class="w-3 h-3 bg-emerald-500 rounded-full"></div>
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 ml-2">CalcPro v2.0</span>
                </div>
                <div class="flex items-center space-x-3">
                    <!-- Angle Unit Toggle (Deg/Rad) -->
                    <button id="angleToggle" onclick="toggleAngleUnit()" class="text-xs font-bold px-2.5 py-1 bg-slate-100 dark:bg-slate-800 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                        DEG
                    </button>
                    <!-- Dark Mode Button -->
                    <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                        <i class="fa-solid fa-moon dark:hidden"></i>
                        <i class="fa-solid fa-sun hidden dark:inline"></i>
                    </button>
                    <!-- History Toggle Mobile -->
                    <button onclick="toggleHistoryDrawer()" class="md:hidden w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </button>
                </div>
            </div>

            <div class="bg-slate-50 dark:bg-slate-950/50 p-5 rounded-2xl border border-slate-200/60 dark:border-slate-800/60 mb-6 text-right flex flex-col justify-end min-h-[110px] shadow-inner">
                <div id="historyExpression" class="text-slate-400 dark:text-slate-500 text-sm sm:text-base font-medium h-6 overflow-x-auto whitespace-nowrap"></div>
                <div id="mainDisplay" class="text-3xl sm:text-4xl font-bold tracking-tight text-slate-900 dark:text-white overflow-x-auto whitespace-nowrap">0</div>
            </div>

            <div class="grid grid-cols-5 gap-2 sm:gap-3">
                <!-- Scientific Row 1 -->
                <button onclick="appendFunction('sin')" class="btn-press bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-emerald-600 dark:text-emerald-400 font-semibold py-3 rounded-xl text-xs sm:text-sm transition">sin</button>
                <button onclick="appendFunction('cos')" class="btn-press bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-emerald-600 dark:text-emerald-400 font-semibold py-3 rounded-xl text-xs sm:text-sm transition">cos</button>
                <button onclick="appendFunction('tan')" class="btn-press bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-emerald-600 dark:text-emerald-400 font-semibold py-3 rounded-xl text-xs sm:text-sm transition">tan</button>
                <button onclick="appendValue('(')" class="btn-press bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-semibold py-3 rounded-xl text-xs sm:text-sm transition">(</button>
                <button onclick="appendValue(')')" class="btn-press bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-semibold py-3 rounded-xl text-xs sm:text-sm transition">)</button>

                <!-- Scientific Row 2 -->
                <button onclick="appendFunction('sqrt')" class="btn-press bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-emerald-600 dark:text-emerald-400 font-semibold py-3 rounded-xl text-xs sm:text-sm transition">√</button>
                <button onclick="appendValue('^')" class="btn-press bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-emerald-600 dark:text-emerald-400 font-semibold py-3 rounded-xl text-xs sm:text-sm transition">x^y</button>
                <button onclick="appendFunction('log')" class="btn-press bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-emerald-600 dark:text-emerald-400 font-semibold py-3 rounded-xl text-xs sm:text-sm transition">log</button>
                <button onclick="appendConstant('pi')" class="btn-press bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-emerald-600 dark:text-emerald-400 font-semibold py-3 rounded-xl text-xs sm:text-sm transition">π</button>
                <button onclick="appendConstant('e')" class="btn-press bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-emerald-600 dark:text-emerald-400 font-semibold py-3 rounded-xl text-xs sm:text-sm transition">e</button>

                <!-- Standard Row 1 -->
                <button onclick="clearAll()" class="btn-press bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 text-rose-600 dark:text-rose-400 font-bold py-3.5 rounded-xl text-sm transition">C</button>
                <button onclick="backspace()" class="btn-press bg-amber-50 dark:bg-amber-950/40 hover:bg-amber-100 text-amber-600 dark:text-amber-400 font-bold py-3.5 rounded-xl text-sm transition"><i class="fa-solid fa-delete-left"></i></button>
                <button onclick="appendValue('%')" class="btn-press bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold py-3.5 rounded-xl text-sm transition">%</button>
                <button onclick="appendOperator('/')" class="btn-press bg-emerald-50 dark:bg-emerald-950/40 hover:bg-emerald-100 text-emerald-600 dark:text-emerald-400 font-bold py-3.5 rounded-xl text-sm transition">÷</button>
                <button onclick="appendOperator('*')" class="btn-press bg-emerald-50 dark:bg-emerald-950/40 hover:bg-emerald-100 text-emerald-600 dark:text-emerald-400 font-bold py-3.5 rounded-xl text-sm transition">×</button>

                <!-- Standard Row 2 -->
                <button onclick="appendValue('7')" class="btn-press bg-white dark:bg-slate-800/80 hover:bg-slate-100 dark:hover:bg-slate-700 shadow-sm font-semibold py-3.5 rounded-xl text-base transition">7</button>
                <button onclick="appendValue('8')" class="btn-press bg-white dark:bg-slate-800/80 hover:bg-slate-100 dark:hover:bg-slate-700 shadow-sm font-semibold py-3.5 rounded-xl text-base transition">8</button>
                <button onclick="appendValue('9')" class="btn-press bg-white dark:bg-slate-800/80 hover:bg-slate-100 dark:hover:bg-slate-700 shadow-sm font-semibold py-3.5 rounded-xl text-base transition">9</button>
                <button onclick="appendOperator('-')" class="btn-press bg-emerald-50 dark:bg-emerald-950/40 hover:bg-emerald-100 text-emerald-600 dark:text-emerald-400 font-bold py-3.5 rounded-xl text-sm transition">-</button>
                <button onclick="appendOperator('+')" class="btn-press bg-emerald-50 dark:bg-emerald-950/40 hover:bg-emerald-100 text-emerald-600 dark:text-emerald-400 font-bold py-3.5 rounded-xl text-sm transition">+</button>

                <!-- Standard Row 3 -->
                <button onclick="appendValue('4')" class="btn-press bg-white dark:bg-slate-800/80 hover:bg-slate-100 dark:hover:bg-slate-700 shadow-sm font-semibold py-3.5 rounded-xl text-base transition">4</button>
                <button onclick="appendValue('5')" class="btn-press bg-white dark:bg-slate-800/80 hover:bg-slate-100 dark:hover:bg-slate-700 shadow-sm font-semibold py-3.5 rounded-xl text-base transition">5</button>
                <button onclick="appendValue('6')" class="btn-press bg-white dark:bg-slate-800/80 hover:bg-slate-100 dark:hover:bg-slate-700 shadow-sm font-semibold py-3.5 rounded-xl text-base transition">6</button>
                <button onclick="appendValue('.')" class="btn-press bg-white dark:bg-slate-800/80 hover:bg-slate-100 dark:hover:bg-slate-700 shadow-sm font-semibold py-3.5 rounded-xl text-base transition">.</button>
                <button onclick="calculate()" class="btn-press row-span-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-lg shadow-lg shadow-emerald-600/30 flex items-center justify-center transition">=</button>

                <!-- Standard Row 4 -->
                <button onclick="appendValue('1')" class="btn-press bg-white dark:bg-slate-800/80 hover:bg-slate-100 dark:hover:bg-slate-700 shadow-sm font-semibold py-3.5 rounded-xl text-base transition">1</button>
                <button onclick="appendValue('2')" class="btn-press bg-white dark:bg-slate-800/80 hover:bg-slate-100 dark:hover:bg-slate-700 shadow-sm font-semibold py-3.5 rounded-xl text-base transition">2</button>
                <button onclick="appendValue('3')" class="btn-press bg-white dark:bg-slate-800/80 hover:bg-slate-100 dark:hover:bg-slate-700 shadow-sm font-semibold py-3.5 rounded-xl text-base transition">3</button>
                <button onclick="appendValue('0')" class="btn-press bg-white dark:bg-slate-800/80 hover:bg-slate-100 dark:hover:bg-slate-700 shadow-sm font-semibold py-3.5 rounded-xl text-base col-span-2 transition">0</button>
            </div>
        </div>

        <div id="historyDrawer" class="w-full md:w-80 bg-slate-50 dark:bg-slate-950/60 border-t md:border-t-0 md:border-l border-slate-200 dark:border-slate-800 p-5 flex flex-col transition-all duration-300">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-sm tracking-wide uppercase text-slate-500 dark:text-slate-400 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left"><span>Historial</span></i>
                </h3>
                <button onclick="clearHistory()" class="text-xs text-rose-500 hover:text-rose-600 font-semibold transition">Limpiar</button>
            </div>
            <div id="historyList" class="flex-1 overflow-y-auto space-y-3 max-h-[250px] md:max-h-[440px] pr-1">
                <div class="text-center text-slate-400 dark:text-slate-600 text-sm py-12">No hay cálculos recientes</div>
            </div>
        </div>

    </div>

    <script>
        let currentInput = '0';
        let expression = '';
        let history = [];
        let angleUnit = 'DEG'; // DEG or RAD

        const mainDisplay = document.getElementById('mainDisplay');
        const historyExpression = document.getElementById('historyExpression');
        const historyList = document.getElementById('historyList');

        function updateDisplay() {
            mainDisplay.innerText = currentInput;
            historyExpression.innerText = expression;
        }

        function appendValue(val) {
            if (currentInput === '0' && val !== '.') {
                currentInput = val;
            } else {
                currentInput += val;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            currentInput += ` ${op} `;
            updateDisplay();
        }

        function appendFunction(func) {
            if (currentInput === '0') {
                currentInput = `${func}(`;
            } else {
                currentInput += `${func}(`;
            }
            updateDisplay();
        }

        function appendConstant(constName) {
            const val = constName === 'pi' ? Math.PI.toFixed(8) : Math.E.toFixed(8);
            if (currentInput === '0') {
                currentInput = val;
            } else {
                currentInput += val;
            }
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            expression = '';
            updateDisplay();
        }

        function backspace() {
            if (currentInput.length > 1) {
                currentInput = currentInput.trim();
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        function toggleAngleUnit() {
            angleUnit = angleUnit === 'DEG' ? 'RAD' : 'DEG';
            document.getElementById('angleToggle').innerText = angleUnit;
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        function toggleHistoryDrawer() {
            const drawer = document.getElementById('historyDrawer');
            drawer.classList.toggle('hidden');
        }

        function clearHistory() {
            history = [];
            renderHistory();
        }

        function calculate() {
            try {
                expression = currentInput;
                
                // Parse friendly mathematical expressions into evaluatable JavaScript code
                let evalString = currentInput
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/')
                    .replace(/\^/g, '**')
                    .replace(/%/g, '/100');

                // Handle scientific trigonometric functions with DEG/RAD support
                evalString = evalString.replace(/sin\(/g, angleUnit === 'DEG' ? 'Math.sin(Math.PI/180*' : 'Math.sin(');
                evalString = evalString.replace(/cos\(/g, angleUnit === 'DEG' ? 'Math.cos(Math.PI/180*' : 'Math.cos(');
                evalString = evalString.replace(/tan\(/g, angleUnit === 'DEG' ? 'Math.tan(Math.PI/180*' : 'Math.tan(');
                evalString = evalString.replace(/sqrt\(/g, 'Math.sqrt(');
                evalString = evalString.replace(/log\(/g, 'Math.log10(');

                let result = eval(evalString);

                if (!isFinite(result) || isNaN(result)) {
                    throw new Error("Math Error");
                }

                // Format result cleanly
                result = parseFloat(result.toFixed(8));

                addToHistory(expression, result);
                currentInput = result.toString();
                expression = '';
                updateDisplay();
            } catch (error) {
                currentInput = 'Error';
                updateDisplay();
                setTimeout(() => {
                    currentInput = '0';
                    updateDisplay();
                }, 1200);
            }
        }

        function addToHistory(expr, res) {
            history.unshift({ expr, res });
            if (history.length > 15) history.pop();
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<div class="text-center text-slate-400 dark:text-slate-600 text-sm py-12">No hay cálculos recientes</div>';
                return;
            }
            historyList.innerHTML = history.map(item => `
                <div class="bg-white dark:bg-slate-900 p-3 rounded-xl border border-slate-200/60 dark:border-slate-800 shadow-sm flex flex-col text-right">
                    <span class="text-xs text-slate-400">${item.expr}</span>
                    <span class="text-base font-bold text-emerald-600 dark:text-emerald-400">= ${item.res}</span>
                </div>
            `).join('');
        }

        // Keyboard Support
        window.addEventListener('keydown', (e) => {
            if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
                appendValue(e.key);
            } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                appendOperator(e.key);
            } else if (e.key === 'Enter' || e.key === '=') {
                calculate();
            } else if (e.key === 'Backspace') {
                backspace();
            } else if (e.key === 'Escape') {
                clearAll();
            } else if (e.key === '(' || e.key === ')') {
                appendValue(e.key);
            }
        });
    </script>
</body>
</html>
